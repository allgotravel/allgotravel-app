<div>
  <p style="font-size:20px">🔒 Abriendo el pago seguro…</p>
  <p><a id="go" href="https://payhip.com/b/s1x5w">Toca aquí si no se abre</a></p>
  <p style="opacity:.7;font-size:14px">AllGo Travel App</p>
</div>
<script>
(function () {
  var fallback = document.getElementById('go').getAttribute('href');
  var to = '';
  try { to = new URLSearchParams(location.search).get('to') || ''; } catch (_) {}
  if (!/^https:\/\/(pay\.hotmart\.com\/|payhip\.com\/b\/)/.test(to)) to = fallback;
  document.getElementById('go').href = to;
  setTimeout(function () { location.replace(to); }, 1200);
})();
</script>
